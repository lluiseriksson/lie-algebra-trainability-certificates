[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lie-algebra-trainability-certificates"
version = "1.0.0"
description = "Exact-Q Adjoint-Irrep Variance Laws, Majorana Hodge-Chiral Selection Rules, and Machine-Checked Trainability Certificates for Compact Lie-Group Quantum Circuits"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
